# pytest config for on-target (pytest-embedded) tests.
#
# The `esp,idf` embedded services make the `dut` fixture flash the ESP-IDF build
# and talk to the board over serial. Target and port are passed on the command
# line (so the same tests work for any attached board / CI runner):
#
#   pytest test_target/ --target esp32 --port /dev/ttyUSB1
[pytest]
addopts = --embedded-services esp,idf
# Look for the build output in the repo's build/ directory.
# (pytest-embedded's idf service auto-detects build/ by default.)
