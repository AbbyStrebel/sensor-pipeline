name: CI

# Run on pushes to main, version tags, and on every pull request targeting main.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least-privilege default for the whole workflow. The release job opts UP to
# contents: write for itself only (see that job). Every other job is read-only.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build the real firmware for every supported target. Proves the hardware-
  # facing code and component wiring compile with the pinned, stable ESP-IDF
  # release on each chip. The authoritative target list lives in
  # tools/targets.sh; keep this matrix in sync when adding a variant.
  # ---------------------------------------------------------------------------
  firmware-build:
    name: Firmware build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one target failing shouldn't hide the others
      matrix:
        target: [esp32, esp32c6]
    container:
      image: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: build/sensor_pipeline.bin
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Host unit tests for the pure logic. Built as a plain native binary (gcc),
  # NOT the IDF linux target: the `processor` component has no IDF deps, so this
  # is fast, produces working gcov coverage, and runs under valgrind.
  #
  # Unity is still taken from ESP-IDF, so the IDF image is a convenient base
  # that already has it on disk at $IDF_PATH.
  # ---------------------------------------------------------------------------
  host-tests:
    name: Host tests + valgrind + coverage
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4

      - name: Install host test tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential valgrind gcovr

      - name: Run unit tests
        shell: bash
        working-directory: test_host
        run: make test

      - name: Run unit tests under Address/UB sanitizers
        shell: bash
        working-directory: test_host
        run: make asan

      - name: Run unit tests under valgrind
        shell: bash
        working-directory: test_host
        run: make valgrind

      - name: Coverage report
        shell: bash
        working-directory: test_host
        run: |
          make coverage
          # Emit a machine-readable report for the artifact.
          gcovr --root .. --filter '../components/processor/' \
                --xml coverage.xml --txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: test_host/coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Build the API documentation with Doxygen and publish it as an artifact.
  # Fails if Doxygen emits any warning, keeping docs honest as code changes.
  # ---------------------------------------------------------------------------
  docs:
    name: API docs (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Build docs (warnings fail the build)
        shell: bash
        run: |
          # Treat any Doxygen warning OR a non-zero Doxygen exit as an error.
          set -o pipefail
          if ! warnings="$(doxygen docs/Doxyfile 2>&1 >/dev/null)"; then
            echo "Doxygen exited non-zero:"
            echo "$warnings"
            exit 1
          fi
          if [ -n "$warnings" ]; then
            echo "Doxygen emitted warnings:"
            echo "$warnings"
            exit 1
          fi
          test -f docs/html/index.html

      - name: Upload HTML docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-html
          path: docs/html
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Lint gate: formatting + static analysis on first-party code.
  # Runs in the IDF container because clang-tidy needs the compile database that
  # `idf.py build` generates. clang-format and cppcheck are build-independent.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (clang-format, clang-tidy, cppcheck)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-tidy clang-format cppcheck python3

      - name: clang-format (check only, fails on any diff)
        shell: bash
        run: |
          mapfile -t files < <(find components main -name '*.c' -o -name '*.h')
          clang-format --dry-run --Werror "${files[@]}"

      - name: cppcheck
        shell: bash
        run: ./tools/cppcheck.sh

      - name: Build (for clang-tidy compile database)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: clang-tidy
        shell: bash
        run: ./tools/clang-tidy.sh

  # ---------------------------------------------------------------------------
  # Package a complete, flashable, verifiable firmware bundle for each supported
  # target and upload it as a CI artifact on every push/PR (ephemeral, for
  # testing + debugging). One bundle per chip; artifact names are suffixed with
  # the target so they don't collide.
  # ---------------------------------------------------------------------------
  package:
    name: Package firmware bundle (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c6]
    container:
      image: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags/history for manifest git_ref

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Package bundle
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tools/package.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # On a version tag (v*), publish a bundle for each target to a GitHub Release.
  # This is the ONLY job granted contents: write, and it only runs on tags.
  # The matrix runs once per target; action-gh-release appends each target's
  # bundle to the same Release (no clobber).
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release (${{ matrix.target }})
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c6]
    permissions:
      contents: write   # scoped to this job only; needed to create the Release
    container:
      image: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Package bundle
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tools/package.sh

      - name: Create Release and attach bundle
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Publish the API docs to GitHub Pages. Runs only on pushes to main (never on
  # PRs or tags). Scoped pages/id-token write permissions, this job only.
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: Deploy docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to Pages
      id-token: write   # OIDC token the deploy-pages action verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Build docs (warnings fail the build)
        shell: bash
        run: |
          set -o pipefail
          if ! warnings="$(doxygen docs/Doxyfile 2>&1 >/dev/null)"; then
            echo "Doxygen exited non-zero:"; echo "$warnings"; exit 1
          fi
          if [ -n "$warnings" ]; then
            echo "Doxygen emitted warnings:"; echo "$warnings"; exit 1
          fi
          test -f docs/html/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # On-target hardware test. Runs on a SELF-HOSTED runner that has the matching
  # board attached. One matrix leg per target; each leg targets a runner label
  # equal to the target name (esp32, esp32c6). A leg only actually runs when a
  # runner carrying that label is online — so if you only have the C6 plugged
  # in, the esp32 leg just stays queued and vice versa. That lets both chips be
  # first-class without requiring both to be present.
  #
  # SECURITY: self-hosted + public repo is only safe if this job runs
  # exclusively on trusted events. It is therefore:
  #   - gated to push events on main of THIS repo (never PRs, never forks),
  #   - Pi/SBC-friendly: it does NOT build; it downloads the prebuilt bundle
  #     for its target from the `package` job, flashes it, runs pytest-embedded.
  # See docs/self-hosted-runner.md for runner setup + hardening.
  # ---------------------------------------------------------------------------
  on-target:
    name: On-target test (${{ matrix.target }})
    needs: package
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'AbbyStrebel/sensor-pipeline'
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c6]
    # Pick the runner whose label matches this target's chip.
    runs-on: [self-hosted, "${{ matrix.target }}"]
    # The serial port the board enumerates as on the runner. Override per target
    # with a repository variable (Settings -> Secrets and variables -> Actions
    # -> Variables): ESP32_PORT for esp32, ESP32C6_PORT for esp32c6. Both
    # default to /dev/ttyUSB0.
    env:
      BOARD_PORT: ${{ matrix.target == 'esp32c6' && (vars.ESP32C6_PORT || '/dev/ttyUSB0') || (vars.ESP32_PORT || '/dev/ttyUSB0') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: firmware-bundle-${{ matrix.target }}
          path: bundle

      - name: Extract bundle
        shell: bash
        run: |
          mkdir -p bundle/extracted
          tar -xzf bundle/*.tar.gz -C bundle/extracted --strip-components=1

      - name: Set up Python deps for pytest-embedded
        shell: bash
        run: |
          python3 -m pip install --user --quiet \
            pytest-embedded pytest-embedded-serial-esp pytest-embedded-idf

      - name: Flash prebuilt bundle
        shell: bash
        working-directory: bundle/extracted
        run: ./flash.sh "$BOARD_PORT"

      - name: Run on-target tests
        shell: bash
        working-directory: test_target
        # --app-path points at the extracted bundle so pytest-embedded can find
        # the flashed binaries' metadata; the board is already flashed above.
        run: |
          python3 -m pytest -v \
            --target ${{ matrix.target }} \
            --port "$BOARD_PORT" \
            --app-path "$GITHUB_WORKSPACE/bundle/extracted"
